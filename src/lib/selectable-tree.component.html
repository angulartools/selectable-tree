@for (item of items(); track item.id) {
  <ng-container
    [ngTemplateOutlet]="itemTemplate"
    [ngTemplateOutletContext]="{ item }">
  </ng-container>
}

<ng-template #itemTemplate let-item="item">

  <div class="tree-row">

    <!-- INDENTAÇÃO + TOGGLE -->
    <div
      class="tree-toggle"
      [style.margin-left.px]="(item.level ?? 0) * 16">

      @if (item.children?.length && !item.open) {
        <button
          type="button"
          mat-icon-button
          color="accent"
          (click)="openToggle(item)">

          <i class="fal fa-chevron-right tree-icon"></i>
        </button>
      }

      @if (item.children?.length && item.open) {
        <button
          type="button"
          mat-icon-button
          color="accent"
          (click)="closeToggle(item)">

          <i class="fal fa-chevron-down tree-icon"></i>
        </button>
      }

    </div>

    <!-- CHECKBOX -->
    <mat-checkbox
      class="tree-checkbox"
      color="primary"
      [disabled]="item.readonly"
      [checked]="item.selected"
      [indeterminate]="item.indeterminate"
      (click)="$event.stopPropagation()"
      (change)="toggle(item, $event.checked)">

      <span class="tree-label">
        {{ item.name }}
      </span>

    </mat-checkbox>

  </div>

  <!-- CHILDREN -->
  @if (item.open && item.children?.length) {
    @for (child of item.children; track child.id) {
      <ng-container
        [ngTemplateOutlet]="itemTemplate"
        [ngTemplateOutletContext]="{ item: child }">
      </ng-container>
    }
  }

</ng-template>
